/* Layout: satu kolom sempit (maks 760px) seperti buku catatan sopir. Header menempel di atas, navigasi tab menempel di bawah. */

  --bad: #B3261E;
  --bad-soft: #FCE4E1;
  --good: #1B7A47;
  --good-soft: #DDF1E5;
  --shadow: 0 1px 2px rgba(19,38,43,.06), 0 4px 14px rgba(19,38,43,.06);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;

    --accent: #55C6CE; --accent-ink: #062226; --accent-soft: #173A3E;
    --warn: #F2B85B; --warn-soft: #3A2D12; --bad: #FF8F85; --bad-soft: #3F1B18; --good: #6FD39A; --good-soft: #14341F;

:root[data-theme="dark"] {
  --bg: #0E1A1D; --card: #162428; --card-2: #1C2D32; --line: #2A3E44; --ink: #E7EFF0; --muted: #94AAB0;
  --accent: #55C6CE; --accent-ink: #062226; --accent-soft: #173A3E;
  --warn: #F2B85B; --warn-soft: #3A2D12; --bad: #FF8F85; --bad-soft: #3F1B18; --good: #6FD39A; --good-soft: #14341F;

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {

button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 760px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

/* header */
.top {

  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand h1 { font-size: 26px; line-height: 1; white-space: nowrap; }
.brand p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.brand { min-width: 0; }
.sync { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.sync.ok { color: var(--good); } .sync.err { color: var(--bad); }

/* tabs */
.tabs {

}
.tabs .wrap { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
.tab { background: none; border: 0; padding: 7px 2px 5px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted); font-size: 12px; font-weight: 600; border-radius: 10px; min-width: 0; }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }

main { padding-block: 16px 0; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); min-width: 0; }
.flat { background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 440px) { .grid2.stack { grid-template-columns: 1fr; } }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.sec-title { font-size: 20px; margin-bottom: 8px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
input, select, textarea {
  width: 100%; min-width: 0; min-height: 46px; padding: 9px 12px; background: var(--card); color: var(--ink);
  border: 1.5px solid var(--line); border-radius: 10px; font-size: 16px; font-weight: 500;
}
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 55%, calc(100% - 12px) 55%; background-size: 6px 6px; background-repeat: no-repeat; padding-right: 32px; text-overflow: ellipsis; }
input:focus, select:focus { border-color: var(--accent); }
input.warn { border-color: var(--warn); background: var(--warn-soft); }
.btn { min-height: 44px; padding: 8px 16px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.lockbadge { font-size: 11px; font-weight: 600; color: var(--muted, #566A70); background: var(--soft, #DCEFF0); border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
input.locked { opacity: .75; cursor: not-allowed; }
.btn.sm { min-height: 36px; padding: 4px 12px; font-size: 14px; }
.btn:disabled { opacity: .5; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; min-height: 42px; font-weight: 600; color: var(--muted); padding: 4px 6px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

/* pills */
.pill { display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--card-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }

/* day bar */
.daybar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.daybar h2 { font-size: 30px; line-height: 1.05; }
.daybar .nav { display: flex; gap: 8px; }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); display: grid; place-items: center; }
.icon-btn svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.strip { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x proximity; scrollbar-width: thin; }
.chip { flex: 0 0 auto; scroll-snap-align: center; width: 54px; padding: 7px 0 6px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); display: flex; flex-direction: column; align-items: center; gap: 1px; line-height: 1.1; }

.chip.today { border-color: var(--accent); }
.chip[aria-current="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip[aria-current="true"] .wd, .chip[aria-current="true"] .rt { color: var(--accent-ink); opacity: .9; }

.slot { display: flex; flex-direction: column; gap: 10px; }
.slot-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.result { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 10px 12px; border-radius: 12px; background: var(--card-2); border: 1px solid var(--line); flex-wrap: wrap; }
.result .km { font-family: var(--f-display); font-weight: 700; font-size: 34px; line-height: 1; }

.steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 12px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 600; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .fill { transition: width .3s ease; } }

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var el = e.target.closest('button'); if (!el) return;
  if (el.dataset.tab) { UI.tab = el.dataset.tab; saveUi(); render(); window.scrollTo(0, 0); return; }
  if (el.dataset.day) { UI.day = +el.dataset.day; render(); return; }
  if (el.dataset.nav) { UI.day = Math.min(30, Math.max(1, UI.day + +el.dataset.nav)); render(); window.scrollTo(0, 0); return; }
  if (el.dataset.shift) { if (locked()) { toast('Buku periode ini ditutup'); return; } var d = getDay(UI.day, true); d.shift = d.shift === el.dataset.shift ? '' : el.dataset.shift; $$('#shift button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.shift === d.shift)); }); touch(); return; }
  if (el.dataset.basis) { S.settings.kmBasis = el.dataset.basis; $$('#basis button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.basis === el.dataset.basis)); }); touch(); updateGaji(); return; }
  if (el.dataset.addtype) { UI.draft.name = ($('#an') || {}).value || ''; UI.draft.abs = ($('#aa') || {}).value || ''; UI.adding = el.dataset.addtype; render(); return; }
  var a = el.dataset.act; if (!a) return;
  if (locked() && (a === 'copyprev' || a === 'clearday')) { toast('Buku periode ini ditutup'); return; }
  if (a === 'copyprev') {
    var prev = getDay(UI.day - 1); if (!prev) { toast('Hari sebelumnya masih kosong'); return; }
    var cur = getDay(UI.day, true); cur.shift = prev.shift; cur.slots = prev.slots.map(function (s) { return { l: s.l, d: s.d, bd: s.bd, lj: s.lj || '', pdf: '', note: '' }; });
    touch(); render(); toast('Slot disalin. KM PDF dikosongkan.');
  } else if (a === 'clearday') {
    if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'Ketuk lagi untuk mengosongkan'; setTimeout(function () { el.dataset.sure = ''; el.textContent = 'Kosongkan hari ini'; }, 3000); return; }
    delete P().days[String(UI.day)]; touch(); render(); toast('Hari dikosongkan');
  } else if (a === 'copyrekap') copyText(rekapText());
  else if (a === 'csv') saveCsv();
  else if (a === 'csvimport') { var cf = $('#csvFile'); if (cf) cf.click(); }
  else if (a === 'closebook') {
    if (el.dataset.sure !== '1') {
      var inc = totals(1, N()).incomplete; el.dataset.sure = '1';
      el.textContent = inc ? inc + ' slot belum lengkap. Ketuk lagi untuk tutup' : 'Ketuk lagi untuk menutup buku';
      setTimeout(function () { el.dataset.sure = ''; el.textContent = 'Tutup buku'; }, 3500); return;
    }
    P().closed = true; P().closedAt = todayStr(); touch(); render(); toast('Buku periode ditutup');
  }
  else if (a === 'openbook') { P().closed = false; P().closedAt = ''; touch(); render(); toast('Buku dibuka kembali'); }
  else if (a === 'newperiod') {
    var ch = periodChain(), ix = -1; ch.forEach(function (q, n) { if (q.start === UI.cur) ix = n; });
    var nx = ch[ix + 1]; if (!nx) { toast('Tidak ada periode berikutnya'); return; }
    selectPeriod(nx.start); render(); window.scrollTo(0, 0); toast(periodTitle(nx.start, nx.end));
  }
  else if (a === 'resethk' || a === 'resetrekap') {
    if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = 'Ketuk lagi untuk reset'; setTimeout(function () { el.dataset.sure = ''; el.textContent = el.dataset.label; }, 3500); return; }
    var pd = P().days;
    if (a === 'resethk') { Object.keys(pd).forEach(function (k) { pd[k].shift = ''; }); P().hkOverride = ''; toast('HK direset'); }
    else { Object.keys(pd).forEach(function (k) { pd[k].slots = [blankSlot(), blankSlot(), blankSlot()]; }); toast('Rekapan direset'); }
    touch(); render();
  }
  else if (a === 'backup') { downloadFile('cadangan-ritase-' + todayStr() + '.json', JSON.stringify(serialize()), 'application/json'); toast('Cadangan diunduh'); }
  else if (a === 'update') {
    var fin = function () { location.reload(); };
    Promise.all([navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : 0, window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : 0]).then(fin, fin);
  }
  else if (a === 'restore') { var rf = $('#restoreFile'); if (rf) rf.click(); }
  else if (a === 'addopen') { UI.adding = el.dataset.type; UI.draft = { name: '', abs: '' }; UI.edit = null; render(); }
  else if (a === 'addcancel') { UI.adding = null; render(); }
  else if (a === 'addsave') addSave();
  else if (a === 'editloc') { var same = UI.edit && UI.edit.type === el.dataset.type && UI.edit.name === el.dataset.name; UI.edit = same ? null : { type: el.dataset.type, name: el.dataset.name, confirm: false }; UI.adding = null; render(); }
  else if (a === 'canceledit') { UI.edit = null; render(); }
  else if (a === 'saveloc') editSave();
  else if (a === 'delloc') {
    if (!UI.edit.confirm) { UI.edit.confirm = true; render(); return; }
    var t = UI.edit.type, nm = UI.edit.name;
    if (t === 'l') S.loadings = S.loadings.filter(function (x) { return x.name !== nm; }); else S.dumpings = S.dumpings.filter(function (x) { return x.name !== nm; });
    S.dist = S.dist.filter(function (x) { return !(t === 'l' ? x.l === nm : x.d === nm); }); rebuildDist(); UI.edit = null; touch(); render(); toast('Lokasi dihapus');
  }
});
function nameError(type, name, except) {
  if (!name) return 'Nama lokasi belum diisi.';
  if (/[|]/.test(name)) return 'Nama tidak boleh memakai tanda |.';
  if (name === BD || name.toLowerCase() === BD_LABEL.toLowerCase() || name.toLowerCase() === LJB.toLowerCase()) return 'Nama itu sudah dipakai oleh bawaan.';
  var list = type === 'l' ? S.loadings : S.dumpings;
  if (list.some(function (x) { return x.name.toLowerCase() === name.toLowerCase() && x.name !== except; })) return 'Nama itu sudah ada di daftar.';
  return '';
}
function addSave() {
  var t = UI.adding, name = ($('#an').value || '').trim(), err = nameError(t, name, null), box = $('#aerr');
  if (err) { box.textContent = err; box.hidden = false; return; }
  var abs = $('#aa').value || '';
  var opp = t === 'l' ? S.dumpings : S.loadings;
  if (t === 'l') S.loadings.push({ name: name, abs: isNum(abs) ? +abs : '' }); else S.dumpings.push({ name: name, abs: isNum(abs) ? +abs : '' });
  $$('[data-ad]').forEach(function (inp) {
    var o = opp[+inp.dataset.ad]; if (!o || !isNum(inp.value)) return;
    S.dist.push(t === 'l' ? { l: name, d: o.name, km: +inp.value } : { l: o.name, d: name, km: +inp.value });
  });
  rebuildDist(); UI.adding = null; UI.draft = { name: '', abs: '' }; touch(); render(); toast('Lokasi ditambahkan');
}
function editSave() {
  var e = UI.edit, name = ($('#en').value || '').trim(), err = nameError(e.type, name, e.name);
  if (err) { toast(err); return; }
  var list = e.type === 'l' ? S.loadings : S.dumpings, obj = list.filter(function (x) { return x.name === e.name; })[0];
  var a = $('#ea').value; obj.abs = isNum(a) ? +a : '';
  renameLoc(e.type, e.name, name); obj.name = name; rebuildDist(); UI.edit = null; touch(); render(); toast('Perubahan disimpan');
}
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.id === 'pperiod') { selectPeriod(t.value); render(); window.scrollTo(0, 0); return; }
  if (t.id === 'csvFile') {
    var cfile = t.files && t.files[0]; if (!cfile) return;
    var cr = new FileReader();
    cr.onload = function () { try { importCsv(String(cr.result)); } catch (er) { UI.importMsg = 'Gagal membaca file CSV.'; render(); } };
    cr.readAsText(cfile); t.value = ''; return;
  }
  if (t.id === 'restoreFile') {
    var file = t.files && t.files[0]; if (!file) return;
    var fr = new FileReader();
    fr.onload = function () { try { var j = JSON.parse(String(fr.result)); if (!j || !j.loadings) throw 0; S = normalize(j); rebuildDist(); initUi(); touch(); render(); toast('Data dipulihkan'); } catch (x) { toast('File cadangan tidak valid'); } };
    fr.readAsText(file); t.value = ''; return;
  }
  if (t.id === 'rf' || t.id === 'rt') {
    UI.from = +$('#rf').value; UI.to = +$('#rt').value;
    if (UI.from > UI.to) { if (t.id === 'rf') UI.to = UI.from; else UI.from = UI.to; }
    render(); return;
  }
  var card = t.closest('.slot');
  if (card && locked()) return;
  if (card && (t.dataset.f === 'l' || t.dataset.f === 'd' || t.dataset.f === 'lj')) {
    var i = +card.dataset.slot, n = UI.day; ensureShift(n);
    var s = getDay(n, true).slots[i]; s[t.dataset.f] = t.value;
    if (t.dataset.f === 'd' && t.value !== BD) { s.lj = ''; if (s.l !== LJB) s.bd = ''; }
    if (t.dataset.f === 'l') { if (t.value === LJB && s.d === BD) { s.d = ''; s.lj = ''; } else if (t.value !== LJB && s.d !== BD) s.bd = ''; }
    touch(); card.outerHTML = slotHtml(n, i); refreshSlotDerived(i);
  }
});
document.addEventListener('input', function (e) {
  var t = e.target, card = t.closest('.slot');
  if (card && locked()) return;
  if (card && t.dataset.f && t.dataset.f !== 'l' && t.dataset.f !== 'd' && t.dataset.f !== 'lj') {
    var i = +card.dataset.slot, n = UI.day; ensureShift(n);
    var s = getDay(n, true).slots[i];
    if (t.dataset.f === 'dist') { if (s.l && s.d) setDist(s.l, s.d, t.value); }
    else s[t.dataset.f] = t.value;
    touch(); refreshSlotDerived(i); return;
  }
  if (t.dataset.mx) {
    var p = t.dataset.mx.split(','), l = S.loadings[+p[0]], d = S.dumpings[+p[1]];

    return;

  if (t.dataset.gp) { P()[t.dataset.gp] = t.value === '' ? '' : +t.value; touch(); updateGaji(); return; }
  if (t.dataset.g) {
    var k = t.dataset.g, num = ['tarif', 'gp', 'insentif', 'onsite', 'openDay', 'closeDay', 'hariBulan', 'bpjsKes', 'bpjsTk', 'pph'].indexOf(k) >= 0;

  }
});
document.addEventListener('visibilitychange', async function () {
  if (document.visibilityState !== 'visible' || !db || dirty || saving || !loaded) return;
  var ae = document.activeElement; if (ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName)) return;

    var snap = await db.doc('app/main').get();
    if (snap.exists && !dirty && snap.data().updated !== lastSaved) { S = normalize(snap.data()); lastSaved = snap.data().updated || ''; rebuildDist(); render(); }
  } catch (e) {}
});
